log:
  # 日志级别：debug | info | warn | error
  level: debug
  # 日志文件存放目录（相对或绝对路径均可，不存在会自动创建）
  dir: logs
  # 是否同时输出到控制台
  console: true
  # 日志文件格式：text（易读）| json（便于采集）
  format: text
  # 异步写入缓冲区大小（条）。写满后新日志会被丢弃，避免磁盘 IO 阻塞业务，默认 4096
  buffer: 4096

  # ---- 文件滚动策略（对齐 logback 的 SizeAndTimeBasedRollingPolicy）----
  # 单文件上限（MB），写满立即切分
  max_size: 100
  # 保留的历史文件个数，超出后删除最旧的，0 表示不限制
  max_backups: 30
  # 历史文件保留天数，0 表示不限制
  max_age: 7
  # 切分出的旧文件压缩方式：none | gzip | zstd
  compress: gzip
  # 时间滚动间隔，到点即使没写满也切分，如 24h、12h；留空或 0 则仅按大小滚动
  rotation_interval: 24h

# HTTP 服务
server:
  # 监听端口
  port: 8080
  # 读超时，0 表示不限制
  read_timeout: 10s
  # 写超时，0 表示不限制
  write_timeout: 10s
  # 可信反向代理 IP/CIDR；为空表示不信任任何代理
  # 例如 nginx 在本机： [127.0.0.1, ::1]
  trusted_proxies: 
    - 127.0.0.1
    - ::1
