# devops-id 分布式 ID 发号服务基础配置

grpc:
  listen: ":9990"
  reflection: false       # dev 环境自动强制开启，便于 grpcurl 调试

nacos:
  enabled: true
  endpoints:
    - "127.0.0.1:8848"
  namespace: ""
  group: "DEVOPS_GROUP"
  username: "nacos"
  password: "nacos"
  timeout: 5s
  config:
    data_ids:
      - "devops-id.yaml"
    group: "DEVOPS_GROUP"
    timeout: 5s
    required: false
  registry:
    service_name: "devops-id"
    cluster: "DEFAULT"
    weight: 1
    meta:
      service: "devops-id"

log:
  level: debug           # debug | info | warn | error
  dir: logs              # 日志文件存放目录（devops-id 服务自身日志）
  console: true          # 是否同时输出到控制台
  format: text           # text | json
  buffer: 4096           # 异步写入缓冲区大小（条），写满丢弃新日志
  max_size: 100          # 单文件上限（MB），写满立即切分
  max_backups: 30        # 保留历史文件个数，0 不限制
  max_age: 7             # 历史文件保留天数，0 不限制
  compress: gzip         # none | gzip | zstd
  rotation_interval: 24h  # 时间滚动间隔，留空或 0 仅按大小滚动

idgen:
  leaf_name: devops-id   # etcd 路径：idgen/snowflake/{leaf_name}/{biz_tag}/
  worker_cache: data     # 本地缓存：{worker_cache}/{leaf_name}/{biz_tag}/worker_id + watermark
  allow_local_fallback: false  # P0-1 fail-closed：etcd 不可用时拒绝发号，仅显式开启才降级
  max_biz_tag_len: 64    # biz_tag 最大字节长度
  max_generators: 1024   # 并发 generator 数上限
  max_batch_count: 100000 # 单次批量取号上限
  watermark_safety_margin: 5s    # 水位预留窗口（须大于 persist_interval）
  watermark_persist_interval: 3s # 水位持久化间隔
  watermark_max_wait: 30s        # 重启等待水位窗口最长时长
