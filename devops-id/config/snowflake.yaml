# snowflake 模式环境覆盖：APP_ENV=snowflake 启动即生效（已按真实 etcd 地址验收通过）：
#   双实例同时启动槽位不冲突（0/1）；kill -9 宕机后 10s lease TTL 自动释放；
#   优雅退出 revoke lease 立即释放；新实例依序抢占释放的槽位。
idgen:
  mode: snowflake

