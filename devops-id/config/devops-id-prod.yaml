# prod 环境覆盖：只保留差异项

log:
  level: warn
  console: false

idgen:
  leaf_name: devops-id
  worker_cache: /app/data
  allow_local_fallback: false
  max_biz_tag_len: 64
  max_generators: 1024
  max_batch_count: 100000
  watermark_safety_margin: 5s
  watermark_persist_interval: 3s
  watermark_max_wait: 30s

etcd:                    # snowflake worker 协调
  endpoints:
    - "192.168.215.3:2379"
  dial_timeout: 5s
  lease_ttl: 10s         # 宕机后槽位释放延迟
