# devops-id 分布式 ID 发号服务基础配置

grpc:
  listen: ":9090"
  reflection: false       # dev 环境自动强制开启，便于 grpcurl 调试

log:
  level: debug            # debug | info | warn | error
  dir: logs              # 日志文件存放目录（devops-id 服务自身日志）
  console: true          # 是否同时输出到控制台
  format: text           # text | json
  buffer: 4096           # 异步写入缓冲区大小（条），写满丢弃新日志
  max_size: 100          # 单文件上限（MB），写满立即切分
  max_backups: 30        # 保留历史文件个数，0 不限制
  max_age: 7             # 历史文件保留天数，0 不限制
  compress: gzip         # none | gzip | zstd
  rotation_interval: 24h  # 时间滚动间隔，留空或 0 仅按大小滚动

mysql:
  host: 127.0.0.1
  port: 3306
  username: devops
  password: "changeme"
  database: devops       # t_leaf_alloc 号段表所在库（默认与 devops-system 同库）
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  log_level: warn        # silent | error | warn | info（GORM 日志级别）

idgen:
  mode: segment          # segment（号段模式，默认）| snowflake
  step: 1000             # segment：号段长度
  low_water: 0.1         # segment：剩余比例低于 10% 时异步预加载下一号段

etcd:                    # 仅 idgen.mode=snowflake 时使用
  endpoints:
    - "127.0.0.1:2379"
  dial_timeout: 5s
  lease_ttl: 10s         # 宕机后槽位释放延迟
  worker_cache: "data/worker_id" # 本地槽位缓存（优先复用原槽）
