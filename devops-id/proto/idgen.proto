// devops-id 发号服务 gRPC 契约。
//
// 语义约定：
//   - biz_tag 业务标识（如 user/role/menu），须先在 t_leaf_alloc 注册（消费方 migrate 负责）
//   - ID 全局唯一、趋势递增；跨号段边界时非严格连续（服务重启/多客户端缓冲导致）
//   - 错误码：InvalidArgument（参数非法）/ NotFound（tag 未注册）/
//     Unavailable（号段耗尽且回源失败、服务不可用）——仅 Unavailable 建议重试
syntax = "proto3";

package idgen;

option go_package = "devops-id/pkg/idgenpb;idgenpb";

// IdGen 分布式 ID 发号服务。
service IdGen {
  // Next 取单个 ID。
  rpc Next(NextRequest) returns (NextReply);

  // BatchNext 原子分配 count 个 ID（客户端预取缓冲用）。
  // 返回单调递增；跨号段边界时非严格连续。
  rpc BatchNext(BatchNextRequest) returns (BatchNextReply);
}

message NextRequest {
  string biz_tag = 1; // 业务标识，不可为空
}

message NextReply {
  int64 id = 1; // 分配的 ID
}

message BatchNextRequest {
  string biz_tag = 1; // 业务标识，不可为空
  int32 count = 2;    // 申请数量，1..step
}

message BatchNextReply {
  repeated int64 ids = 1; // 分配的 ID 列表，单调递增
}
