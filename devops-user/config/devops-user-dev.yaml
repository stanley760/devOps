  key_id: devops-user-rs256-1
  issuer: devops-user    # 须与网关 jwt-auth consumers[].issuer 逐字一致
  access_expire: 2h
  refresh_expire: 168h  # 会话 TTL；C 端首版无 refresh 端点，过期需重新登录

idclient:
  endpoint: "nacos:///devops-id"     # 三斜杠标准形式
  batch: 100
  low_water: 0.2
  dial_timeout: 5s
  call_timeout: 3s

observability:
  otlp_endpoint: "http://127.0.0.1:4318"
  sampler_ratio: 1.0
  metrics_enabled: true

apidoc:
  enabled: true          # dev 开启交互式文档（/apidoc），prod 必须关闭
  base_path: /apidoc

gateway:
  # 本地进程开发：流量入口守卫默认关闭，便于 curl 直连 127.0.0.1:10000 调试。
  # 验证守卫时置 require_jwt: true，此时直连业务接口必须带有效 Bearer token
  #（登录拿到的 access_token）。
  require_jwt: false

# 登录失败限流与账号临时锁定。
#
# bcrypt 只能拖慢单次爆破，无法阻止高速尝试；C 端开放注册、用户名可枚举，
# 必须叠加 IP 限流 + 账号锁定（两者缺一可被绕过）。
#⚠️ 调大阈值前先评估：max_user_fails 过高会让撞库有收益，过低会误伤
#   记不住密码的正常用户（他们应走 refresh 或找回密码）。
login_lock:
  enabled: true
  max_ip_fails: 20           # 单 IP 5 分钟内最多 20 次失败
  ip_window: 5m
  max_user_fails: 5           # 同一账号 15 分钟内 5 次失败即锁定
  user_window: 15m
  lock_ttl: 15m

# 三方登录（GitHub / Google / 微信）。
#
# ⚠️ client_secret 留空 = 该提供方「未配置」，前端隐藏入口。
#    生产值必须由密钥管理注入，**禁止提交入库**。
# ⚠️ redirect_url 必须与三方后台登记的完全一致（含协议、路径、尾斜杠）。
oauth:
  state_ttl: 10m
  # 登录后跳回白名单（防 open redirect 钓鱼）。空列表 = 拒绝一切跳回地址。
  redirect_whitelist:
    - "https://app.example.com"
    - "devops.local"
  github:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:10000/user/api/v1/oauth/github/callback"
    auto_register: false      # 不自动建号：先登录再绑定，可做一致性校验
    nickname_prefix: "GH:"
  google:
    client_id: ""
    client_secret: ""
    redirect_url: "http://localhost:10000/user/api/v1/oauth/google/callback"
    scopes:
      - openid
      - https://www.googleapis.com/auth/userinfo.email
      - https://www.googleapis.com/auth/userinfo.profile
    auto_register: false
    nickname_prefix: "Google:"
  wechat:
    #⚠️ 微信是**网站应用**扫码登录：填开放平台「网站应用」的 AppID，
    #    不是公众号/小程序的 AppID（三套 AppID 互不相通，最常见的坑）。
    client_id: ""
    client_secret: ""          # AppSecret，开放平台可重置，泄露须立即重置
    # ⚠️ 微信开放平台的「授权回调域」只填**域名**（不带协议/端口/路径），
    #    且不接受 IP 与 localhost。本地调试须改 hosts 把域名指向 127.0.0.1。
    #    本地 http 仅用于开发；生产必须 https。
    redirect_url: "http://devops.local:10000/user/api/v1/oauth/wechat/callback"
    # ⚠️ scopes 配了也会被忽略：网站应用只允许 snsapi_login（provider 内部强制）。
    auto_register: false
    nickname_prefix: "微信:"
