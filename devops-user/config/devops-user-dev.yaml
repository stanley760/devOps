# devops-user dev 环境覆盖：只保留差异项
#
# 本文件含 JWT 私钥（dev 用）。生产由密钥管理注入，禁止提交真实值。
# devops-user 刻意使用**独立于 devops-system** 的密钥与 issuer/kid：
# 两者 issuer 相同时，在网关 jwt-auth 的 consumers 里会互相匹配，
# 导致 B 端 token 可访问 C 端接口（反之亦然）。
# 对应网关插件：deploy/higress/wasmplugins/jwt-auth-user-2.0.0.yaml

log:
  level: debug            # debug | info | warn | error
  dir: logs
  console: true
  format: text            # text | json
  buffer: 4096
  max_size: 50
  max_backups: 10
  max_age: 3
  compress: gzip
  rotation_interval: 24h

mysql:
  host: 127.0.0.1
  port: 3306
  username: devops
  password: devopspwd    # 与 docker-compose-dev.yml 的 MYSQL_PASSWORD 一致
  database: devops
  charset: utf8mb4
  max_idle_conns: 20
  max_open_conns: 100
  conn_max_lifetime: 1h
  conn_max_idletime: 10m
  log_level: info

redis:
  host: 127.0.0.1
  port: 6379
  password: "123456"
  db: 1                  # 与 devops-system 的 db 0 分隔，避免键空间互相污染
  pool_size: 50

