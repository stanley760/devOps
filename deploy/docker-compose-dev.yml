# 单节点 Docker 开发环境。生产部署请使用 docker-compose.yml。
name: devops_dev

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: devops
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspwd
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpwd"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      default:
        aliases:
          # 完整域名格式，供 Higress DNS 服务来源（mcpbridges/default.yaml 的 devops-redis）解析
          - redis.devops.local

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
    expose:
      - "9848"
      - "9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  # 一次性配置灌入：把 deploy/higress 下 git 管理的资源目录灌进命名卷（/data），
  # 避免 Windows bind mount 直接挂 /data 导致的高 CPU。每次 up 都会刷新这三个目录，
  # 控制台对其中文件的运行时改动会被覆盖——配置一律改 deploy/higress 下的 yaml。
  higress-init:
    image: busybox:1.36
    volumes:
      - ./higress:/src:ro
      - higress-data:/data
    command:
      - sh
      - -c
      - tar cf - -C /src mcpbridges ingresses services  wasmplugins | tar xf - -C /data

  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.2.3
    environment:
      # 内置 prometheus/loki/promtail/grafana 保持关闭（默认即 off，显式声明以固化意图），
      # 监控使用本 compose 的外部 prometheus/grafana
      O11Y: "off"
      # envoy worker 线程数，默认 16 对 dev 机器过多
      GATEWAY_CONCURRENCY: "2"
    ports:
      - "8001:8001"
      - "8080:8080"
      - "8443:8443"
    volumes:
      - higress-data:/data
    depends_on:
      nacos:
        condition: service_healthy
      higress-init:
        condition: service_completed_successfully

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
    ports:
      - "2379:2379"           # 本地 devops-id 进程通过 127.0.0.1:2379 连接
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # —— 可观测性（dev 本地栈）：Jaeger 追踪 + Prometheus 抓取 + Grafana 可视化 ——

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "4317:4317"           # OTLP gRPC
      - "4318:4318"           # OTLP HTTP（服务 trace 出口）
      - "16686:16686"         # Jaeger UI
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 5s
      timeout: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    # 不依赖业务服务：Prometheus 对目标缺失容错重试，支持部分启动场景

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin   # dev 默认口令，prod 接 SSO/密管
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - jaeger

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  etcd-data:
  grafana-data:
  higress-data: