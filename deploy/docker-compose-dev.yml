# 单节点 Docker 开发环境。生产部署请使用 docker-compose.yml。
name: devops-dev

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: devops
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspwd
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - dev-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpwd"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - dev-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
    expose:
      - "9848"
      - "9849"
    volumes:
      - dev-nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s

  higress:
    image: higress-registry.cn-hangzhou.cr.aliyuncs.com/higress/all-in-one:2.2.3
    ports:
      - "8001:8001"
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./higress:/data
    depends_on:
      nacos:
        condition: service_healthy
      devops-system:
        condition: service_started

  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
    volumes:
      - dev-etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  devops-id:
    build:
      context: ..
      dockerfile: devops-id/Dockerfile
    image: devops-id:dev
    environment:
      APP_ENV: dev
    volumes:
      - ./config/id-dev.yaml:/app/config/devops-id-dev.yaml:ro
      - dev-id-data:/app/data
    depends_on:
      nacos:
        condition: service_healthy
      etcd:
        condition: service_healthy
    stop_grace_period: 30s

  devops-system:
    build:
      context: ..
      dockerfile: devops-system/Dockerfile
    image: devops-system:dev
    ports:
      - "9999:9999"
    environment:
      APP_ENV: dev
    volumes:
      - ./config/system-dev.yaml:/app/config/devops-system-dev.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      devops-id:
        condition: service_started

volumes:
  dev-mysql-data:
  dev-redis-data:
  dev-nacos-data:
  dev-etcd-data:
  dev-id-data:
