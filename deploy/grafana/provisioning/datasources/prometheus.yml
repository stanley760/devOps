# Grafana 数据源一次性配置：Prometheus（默认）+ Jaeger（trace ↔ metrics 互跳）。
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s          # 与 Prometheus scrape_interval 对齐
  - name: Jaeger
    type: jaeger
    uid: jaeger
    url: http://jaeger:16686
    jsonData:
      tracesToMetrics:
        datasourceUid: prometheus   # 从 span 跳转到对应指标面板
