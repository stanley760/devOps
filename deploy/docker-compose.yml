# 单机容器化部署：MySQL + Redis + Nacos + etcd / APISIX + devops-id + devops-system
#
# 标准流程（也可用根目录 Makefile 快捷命令）：
#   docker compose -f deploy/docker-compose.yml build
#   docker compose -f deploy/docker-compose.yml run --rm devops-system migrate   # 业务表 + 种子数据
#   docker compose -f deploy/docker-compose.yml up -d
#   后端不直接发布到宿主机，统一通过网关访问：
#   curl -H 'Host: api.devops.local' http://localhost:8080/healthz
#
# APISIX 网关（可选）：
#   docker compose -f deploy/docker-compose.yml --profile gateway up -d
#   curl -H 'Host: api.devops.local' http://localhost:8080/healthz
#   Nacos 控制台 http://localhost:8848/nacos
#
# devops-id 使用 snowflake，并按 leaf_name + biz_tag 在 etcd 中分配独立 worker：
#   docker compose -f deploy/docker-compose.yml exec etcd etcdctl \
#     --endpoints=http://etcd:2379 get --prefix idgen/snowflake/
#
# 生产提示：本文件密码均为本地默认值；K8s 部署见 deploy/k8s/devops.yaml
name: devops

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpwd
      MYSQL_DATABASE: devops        # 与 config 中 database 保持一致
      MYSQL_USER: devops
      MYSQL_PASSWORD: devopspwd     # 与 deploy/config/*-prod.yaml 保持一致
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootpwd"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped
  nacos:
    image: nacos/nacos-server:v2.4.3
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
    expose:
      - "9848"
      - "9849"
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8848/nacos/v1/console/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "123456"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  # APISIX 网关（standalone 数据面 + YAML 配置源）：路由/上游为 deploy/apisix 下的 git 声明式文件，
  # 变更热加载；多节点/需要 admin API 时再切 traditional 模式（+ etcd），见 deploy/apisix/README.md。
  apisix:
    image: apache/apisix:3.18.0-debian
    profiles: ["gateway"]
    ports:
      - "8080:9080"           # HTTP 网关
      - "8443:9443"           # HTTPS 网关（TLS 需配置 ssls 资源）
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      nacos:
        condition: service_healthy
    restart: unless-stopped

  # devops-id snowflake worker 协调依赖
  etcd:
    image: quay.io/coreos/etcd:v3.5.17
    command:
      - etcd
      - --name=etcd0
      - --advertise-client-urls=http://etcd:2379
      - --listen-client-urls=http://0.0.0.0:2379
      - --initial-advertise-peer-urls=http://etcd:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-cluster=etcd0=http://etcd:2380
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  devops-id:
    build:
      context: ..
      dockerfile: devops-id/Dockerfile
    image: devops-id:latest
    environment:
      APP_ENV: prod
    volumes:
      - ./config/id-prod.yaml:/app/config/devops-id-prod.yaml:ro
      # per-biz_tag worker 缓存；容器重建后由 etcd 重新分配
      - id-data:/app/data
    depends_on:
      nacos:
        condition: service_healthy
      etcd:
        condition: service_healthy
    # 优雅退出：程序收到 SIGTERM 后 revoke lease 立即释放 worker 槽位
    stop_grace_period: 30s
    restart: unless-stopped

  devops-system:
    build:
      context: ..
      dockerfile: devops-system/Dockerfile
    image: devops-system:latest
    expose:
      - "9999"                # 仅供网关/容器网络访问，不发布到宿主机
    environment:
      APP_ENV: prod
    volumes:
      - ./config/system-prod.yaml:/app/config/devops-system-prod.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      devops-id:
        condition: service_started
    restart: unless-stopped

  devops-system-gray:
    build:
      context: ..
      dockerfile: devops-system/Dockerfile
    image: devops-system:latest
    profiles: ["gray"]
    environment:
      APP_ENV: prod
    volumes:
      - ./config/system-gray-bootstrap.yaml:/app/config/bootstrap.yaml:ro
      - ./config/system-gray-prod.yaml:/app/config/devops-system-gray-prod.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      devops-id:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql-data:
  nacos-data:
  redis-data:
  etcd-data:
  id-data:
