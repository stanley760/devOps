# Prometheus 抓取配置（dev compose 内挂载为 /etc/prometheus/prometheus.yml）。
# 业务服务在宿主机本地运行，Prometheus 容器经 host.docker.internal 访问其 /metrics：
#   devops-system：HTTP 端口 9999 上的 /metrics（与 /healthz 同级，不经 Higress）
#   devops-id：gRPC 端口无法承载 HTTP，指标走独立 metrics 端口 9091
global:
  scrape_interval: 15s

scrape_configs:
  - job_name: devops-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:9999
          - host.docker.internal:9091
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
