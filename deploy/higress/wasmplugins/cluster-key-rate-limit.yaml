apiVersion: extensions.higress.io/v1alpha1
kind: WasmPlugin
metadata:
  name: devops-cluster-key-rate-limit
  namespace: higress-system
spec:
  defaultConfig:
    redis:
      service_name: redis
      service_port: 6379
      password: "123456"
  url: oci://higress-registry.cn-hangzhou.cr.aliyuncs.com/plugins/cluster-key-rate-limit:1.0.0
  matchRules:
    - ingress:
        - higress-system/devops-system
        - higress-system/devops-system-canary
      config:
        rule_name: devops-system
        rule_items:
          - limit_by_per_ip: from-remote-addr
            limit_keys:
              - key: 0.0.0.0/0
                query_per_second: 100
        rejected_code: 429
        show_limit_quota_header: true
