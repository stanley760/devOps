apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system-canary
  namespace: higress-system
  annotations:
    higress.io/canary: "true"
    higress.io/canary-weight: "10"
    higress.io/destination: devops-system-gray.DEVOPS-GROUP.public.nacos
    # canary 规则命中后走灰度实例，同样需要注入网关身份头。
    # 注意：Higress 的 canary 分流与 header-control 都作用于最终选中的上游，
    # 但若 canary 路由缺少本注解，命中灰度流量的请求将因缺少身份头被应用层 403。
    higress.io/request-header-control-update: |
      X-Gateway-Token shared-gateway-token-change-me
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # 与 devops-system.yaml 同口径：仅业务 API 与 JWKS，运维端点不经公网网关暴露。
          - path: /api
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
