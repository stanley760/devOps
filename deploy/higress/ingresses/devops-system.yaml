apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system
  namespace: higress-system
  annotations:
    higress.io/destination: devops-system.DEVOPS-GROUP.public.nacos
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # 只路由业务 API 与 JWKS（Higress jwt-auth 插件拉取验签公钥）。
          # 运维端点（/metrics /apidoc /healthz /readyz）仅内网访问，禁止经公网网关暴露。
          - path: /api
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
