apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system
  namespace: higress-system
  annotations:
    higress.io/destination: devops-system.DEVOPS-GROUP.public.nacos
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
