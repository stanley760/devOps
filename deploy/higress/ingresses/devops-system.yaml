apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system
  namespace: higress-system
  annotations:
    higress.io/destination: devops-system.DEVOPS-GROUP.public.nacos:9999
    # 流量入口强制收口（第二层）：以「覆盖」语义注入网关身份头，
    # 应用层 devops-infra/security/gateway.Enforce 用常量时间比较校验该头，
    # 不匹配一律 403。docker compose 无 NetworkPolicy，这是唯一在非 K8s
    # 形态下也真正强制的手段。
    #
    # 必须用 control-update 而非 control-add：add 是把值拼接在原值之后，
    # 客户端自带 X-Gateway-Token 会与之共存并被应用侧比对命中；update 才会
    # 无条件覆盖客户端同名头，使伪造失效。这是整套机制的成败点。
    #
    # 密钥必须与 devops-system 的 gateway.token 一致，生产由密管注入；
    # 此处为本地默认值，禁止将生产密钥提交入库。
    higress.io/request-header-control-update: |
      X-Gateway-Token shared-gateway-token-change-me
  creationTimestamp: "2026-09-28T09:06:38Z"
  labels:
    higress.io/domain_higress-default-domain: "true"
    higress.io/resource-definer: higress
  managedFields:
  - apiVersion: networking.k8s.io/v1
    fieldsType: FieldsV1
    fieldsV1:
      f:metadata:
        f:annotations:
          .: {}
          f:higress.io/destination: {}
          f:higress.io/ignore-path-case: {}
          f:higress.io/match-method: {}
        f:labels:
          .: {}
          f:higress.io/domain_higress-default-domain: {}
          f:higress.io/resource-definer: {}
      f:spec:
        f:ingressClassName: {}
        f:rules: {}
    manager: Kubernetes Java Client
    operation: Update
    time: "2026-09-28T09:06:38Z"
  name: devops-system
  namespace: higress-system
  resourceVersion: "1"
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # 只路由业务 API 与 JWKS（Higress jwt-auth 插件拉取验签公钥）。
          # 运维端点（/metrics /apidoc /healthz /readyz）仅内网访问，禁止经公网网关暴露。
          - path: /system
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
