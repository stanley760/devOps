apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system
  namespace: higress-system
  annotations:
    higress.io/destination: devops-system.DEVOPS-GROUP.public.nacos:9999
    # 流量入口收口已改为 JWT 化：
    #   - 网关侧：wasmplugins/jwt-auth-2.0.0.yaml 验签 Authorization 头，
    #     通过 claims_to_headers 覆盖注入 X-Tenant-ID / X-Jwt-Uid 等内部头；
    #   - 应用侧：devops-infra/security/gateway.Enforce 独立校验 JWT。
    #
    # 原「注入静态 X-Gateway-Token + 常量时间比较」的机制已移除：该凭据不表达身份、
    # 无过期、无吊销，泄露即无限重放，且需在 ingress 与配置间维护共享密钥。
    # 登录/刷新/jwks.json 由 devops-system-public.yaml 承载（匿名），
    # 靠 Higress 最长前缀匹配绕开 jwt-auth——插件按 Ingress 资源挂载，不支持路径匹配。
  creationTimestamp: "2026-09-28T09:06:38Z"
  labels:
    higress.io/domain_higress-default-domain: "true"
    higress.io/resource-definer: higress
  managedFields:
  - apiVersion: networking.k8s.io/v1
    fieldsType: FieldsV1
    fieldsV1:
      f:metadata:
        f:annotations:
          .: {}
          f:higress.io/destination: {}
          f:higress.io/ignore-path-case: {}
          f:higress.io/match-method: {}
        f:labels:
          .: {}
          f:higress.io/domain_higress-default-domain: {}
          f:higress.io/resource-definer: {}
      f:spec:
        f:ingressClassName: {}
        f:rules: {}
    manager: Kubernetes Java Client
    operation: Update
    time: "2026-09-28T09:06:38Z"
  name: devops-system
  namespace: higress-system
  resourceVersion: "1"
spec:
  ingressClassName: higress
  rules:
    - host: api.devops.local
      http:
        paths:
          # 只路由业务 API 与 JWKS（Higress jwt-auth 插件拉取验签公钥）。
          # 运维端点（/metrics /apidoc /healthz /readyz）仅内网访问，禁止经公网网关暴露。
          - path: /system
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
