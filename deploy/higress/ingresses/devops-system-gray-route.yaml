# 灰度实例专用路由：gray.devops.local 100% 直达 devops-system-gray，
# 用于灰度版本的定向验证（不走 canary 权重随机）。
# 与主路由同口径：仅业务 API 与 JWKS，运维端点不经公网网关暴露。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devops-system-gray-route
  namespace: higress-system
  annotations:
    higress.io/destination: devops-system-gray.DEVOPS-GROUP.public.nacos
    # 流量入口身份由 jwt-auth 插件注入的 JWT claims 表达，无需静态身份头注解。
    # 本 ingress 已在 jwt-auth 的 matchRules 中显式列出，故灰度定向流量同样受鉴权。
spec:
  ingressClassName: higress
  rules:
    - host: gray.devops.local
      http:
        paths:
          # ⚠️ 此前误写为 /api，但后端 huma 路由挂在 /system 前缀下（systemAPIPrefix），
          # 该前缀匹配到的请求全被后端 404，灰度定向验证实际从未真正跑到灰度实例。
          - path: /system
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
          - path: /.well-known/jwks.json
            pathType: Prefix
            backend:
              resource:
                apiGroup: networking.higress.io
                kind: McpBridge
                name: default
