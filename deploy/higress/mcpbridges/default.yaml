apiVersion: networking.higress.io/v1
kind: McpBridge
metadata:
  name: default
  namespace: higress-system
spec:
  registries:
    - name: devops-nacos
      type: nacos2
      domain: nacos
      port: 8848
      nacosNamespaceId: public
      nacosGroups:
        - DEVOPS_GROUP
    # 限流插件（cluster-key-rate-limit）的 Redis：dns 服务来源。
    # protocol 用 tcp——McpBridge 2.2.3 不认 redis 协议（报 invalid protocol:redis）。
    # domain 必须是带点的完整域名，对应 compose 里 redis 的网络别名。
    - name: devops-redis
      type: dns
      protocol: tcp
      domain: redis.devops.local
      port: 6379
