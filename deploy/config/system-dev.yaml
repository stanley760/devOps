# Docker 容器环境覆盖（仅 migrate 一次性容器使用）。
# 业务服务改为本地 go run 启动，加载仓库内 devops-system/config/devops-system-dev.yaml（地址 127.0.0.1）。
log:
  level: debug
  dir: /app/logs
  console: true
  format: text

mysql:
  host: mysql
  port: 3306
  username: devops
  password: "devopspwd"
  database: devops

redis:
  host: redis
  port: 6379
  password: "123456"
  db: 0

nacos:
  enabled: true
  endpoints:
    - "nacos:8848"
  namespace: public
  group: "DEVOPS_GROUP"
  registry:
    service_name: "devops-system"

