# 本地进程开发配置：依赖运行在 Docker，devops-system 由 IDE 在宿主机启动。
# 启动前设置 NACOS_REGISTER_IP=<宿主机局域网 IPv4>，例如 192.168.1.20。
# 该地址必须能从 Higress 容器访问，不能使用 127.0.0.1。
log:
  level: debug
  console: true
  format: text

mysql:
  host: 127.0.0.1
  port: 3306
  username: devops
  password: "devopspwd"
  database: devops

redis:
  host: 127.0.0.1
  port: 6379
  password: "123456"
  db: 0

nacos:
  enabled: true
  endpoints:
    - "127.0.0.1:8848"
  namespace: public
  group: "DEVOPS_GROUP"
  registry:
    service_name: "devops-system"

