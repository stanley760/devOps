# devops-id 容器环境覆盖：挂载为镜像内 /app/config/devops-id-prod.yaml，APP_ENV=prod 生效。
# 地址为 docker-compose 服务名（同一网络内的服务发现）；
# K8s 部署时换成对应 Service 名或外部托管服务地址。
log:
  level: info
  dir: /app/logs
  console: true       # 容器标准：日志走 stdout，由 docker/k8s 日志驱动收集
  format: json

nacos:
  enabled: true
  endpoints:
    - "nacos:8848"
  namespace: public
  group: "DEVOPS_GROUP"
  registry:
    service_name: "devops-id"

idgen:
  leaf_name: devops-id
  worker_cache: data

etcd:                 # snowflake worker 协调
  endpoints:
    - "etcd:2379"

# 生产观测口径：采样 0.1 起步；metrics 走独立 HTTP 端口，仅内网抓取。
# otlp_endpoint 留空 = 本地 span 不上报；接入 Jaeger/Tempo/otel-collector 后填写其 OTLP HTTP 地址。
observability:
  otlp_endpoint: ""
  sampler_ratio: 0.1
  metrics_enabled: true
  metrics_listen: ":9091"
