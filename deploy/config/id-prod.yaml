# devops-id 容器环境覆盖：挂载为镜像内 /app/config/devops-id-prod.yaml，APP_ENV=prod 生效。
# 地址为 docker-compose 服务名（同一网络内的服务发现）；
# K8s 部署时换成对应 Service 名或外部托管服务地址。
log:
  level: info
  console: true       # 容器标准：日志走 stdout，由 docker/k8s 日志驱动收集
  format: json

nacos:
  enabled: true
  endpoints:
    - "nacos:8848"
  namespace: public
  group: "DEVOPS_GROUP"
  registry:
    service_name: "devops-id"

idgen:
  leaf_name: devops-id
  worker_cache: data

etcd:                 # snowflake worker 协调
  endpoints:
    - "etcd:2379"
