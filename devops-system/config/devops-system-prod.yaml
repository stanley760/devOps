# prod 环境覆盖：只保留差异项

log:
  level: warn            # debug | info | warn | error
  dir: logs
  console: false
  format: json           # text | json
  buffer: 4096
  max_size: 50
  max_backups: 10
  max_age: 3
  compress: gzip
  rotation_interval: 24h

mysql:
  host: 127.0.0.1
  port: 3306
  username: devops
  password: "changeme"
  database: devops       # 业务库（t_tenant + t_system_* + casbin_rule）
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  log_level: warn

redis:
  host: 127.0.0.1
  port: 6379
  password: "123456"
  db: 0
  pool_size: 100

jwt:
  # RS256 私钥（PKCS#8 PEM），部署时由密钥管理注入，禁止将真实私钥提交入库。
  # 生成：openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
  signing_key: "REPLACE_WITH_RSA_PRIVATE_KEY_PEM"
  key_id: devops-system-rs256-1
  issuer: devops
  access_expire: 2h      # access token 有效期
  refresh_expire: 168h   # refresh token（会话）有效期

tenant:
  mode: shared                     # shared 共享Schema（默认）| schema 租户独立库
  schema_template: "tenant_{code}" # 模式B 库名模板
  max_pools: 64                    # 模式B 租户连接池上限（LRU 淘汰）
  default_code: "default"          # 登录未指定租户时的默认租户 code

idclient:                          # devops-id 发号服务接入
  endpoint: "nacos://devops-id"       # 启用 Nacos 时改为 nacos://devops-id
  batch: 100                       # 预取批量（1 = 关闭预取，逐次 RPC）
  low_water: 0.2                   # 剩余比例低于 20% 时异步补充
  dial_timeout: 3s
  call_timeout: 3s
