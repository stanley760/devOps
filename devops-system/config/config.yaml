# devops-system 用户权限系统基础配置

server:
  port: 9999
  read_timeout: 10s
  write_timeout: 10s
  trusted_proxies:          # 可信反向代理 IP 或 CIDR；不在代理后建议置空 []
    - 127.0.0.1
    - "::1"
  cors:                     # 跨域配置（allow_origins 为空则不启用 CORS）
    allow_origins:          # 允许的前端源，精确匹配；prod 建议收敛为具体域名
      - "http://localhost:5173"   # 常见 Vite dev server
      - "http://localhost:3000"   # 常见 CRA/Next dev server
    allow_credentials: true # 登录态走 Authorization 头 + 可选 Cookie，需携带凭据
    max_age: 12h            # 预检结果缓存，减少 OPTIONS 探测

log:
  level: debug            # debug | info | warn | error
  dir: logs
  console: true
  format: text           # text | json
  buffer: 4096
  max_size: 100
  max_backups: 30
  max_age: 7
  compress: gzip
  rotation_interval: 24h

mysql:
  host: 127.0.0.1
  port: 3306
  username: devops
  password: "changeme"
  database: devops       # 业务库（t_tenant + t_system_* + casbin_rule）
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  log_level: warn

redis:
  host: 127.0.0.1
  port: 6379
  password: "123456"
  db: 0
  pool_size: 100

jwt:
  signing_key: "请替换为至少32位随机串"  # HS256 密钥
  issuer: devops
  access_expire: 2h      # access token 有效期
  refresh_expire: 168h   # refresh token（会话）有效期

tenant:
  mode: shared                     # shared 共享Schema（默认）| schema 租户独立库
  schema_template: "tenant_{code}" # 模式B 库名模板
  max_pools: 64                    # 模式B 租户连接池上限（LRU 淘汰）
  default_code: "default"          # 登录未指定租户时的默认租户 code

idclient:                          # devops-id 发号服务接入
  endpoint: "127.0.0.1:9090"
  batch: 100                       # 预取批量（1 = 关闭预取，逐次 RPC）
  low_water: 0.2                   # 剩余比例低于 20% 时异步补充
  dial_timeout: 3s
  call_timeout: 3s
