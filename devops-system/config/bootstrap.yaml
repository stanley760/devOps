# devops-system 用户权限系统基础配置

server:
  port: 9999
  read_timeout: 10s
  write_timeout: 10s
  trusted_proxies:          # 可信反向代理 IP 或 CIDR；不在代理后建议置空 []
    - 127.0.0.1
    - "::1"

nacos:
  enabled: true
  endpoints:
    - "127.0.0.1:8848"
  namespace: ""
  group: "DEVOPS_GROUP"
  username: "nacos"
  password: "nacos"
  timeout: 5s
  config:
    data_ids:
      - "devops-system.yaml"
    group: "DEVOPS_GROUP"
    timeout: 5s
    required: false
  registry:
    service_name: "devops-system"
    cluster: "DEFAULT"
    weight: 1
    meta:
      service: "devops-system"
