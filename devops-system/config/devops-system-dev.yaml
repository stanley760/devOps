# dev 环境覆盖：只保留差异项
log:
  level: debug            # debug | info | warn | error
  dir: logs
  console: true
  format: text           # text | json
  buffer: 4096
  max_size: 50
  max_backups: 10
  max_age: 3
  compress: gzip
  rotation_interval: 24h

mysql:
  host: 127.0.0.1
  port: 3306
  username: devops
  password: "devopspwd"    # 与 docker-compose-dev.yml 的 MYSQL_PASSWORD 一致
  database: devops       # 业务库（t_tenant + t_system_* + casbin_rule）
  charset: utf8mb4
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  log_level: warn

redis:
  host: 127.0.0.1
  port: 6379
  password: "123456"
  db: 0
  pool_size: 100

